<svg fill="none" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          display: flex;
          justify-content: center;
          align-items: center;
          height: 160px;
          background: #0d1117;
          border-radius: 12px;
          border: 1px solid rgba(56, 139, 253, 0.4);
          box-shadow: 0 0 20px rgba(56, 139, 253, 0.2);
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .text {
          font-size: 32px;
          font-weight: 900;
          letter-spacing: 2px;
          background: linear-gradient(
            90deg,
            #ff007f 0%,
            #7928ca 25%,
            #0070f3 50%,
            #00dfd8 75%,
            #ff007f 100%
          );
          background-size: 200% auto;
          color: transparent;
          -webkit-background-clip: text;
          background-clip: text;
          animation: shine 4s linear infinite, float 3s ease-in-out infinite;
          text-shadow: 0 0 30px rgba(0, 223, 216, 0.3);
          text-align: center;
          padding: 0 20px;
        }

        @keyframes shine {
          to {
            background-position: 200% center;
          }
        }

        @keyframes float {
          0%, 100% {
            transform: translateY(0px);
          }
          50% {
            transform: translateY(-6px);
          }
        }
      </style>

      <div class="container">
        <div class="text">
          PRAKTIKUM STRUKTUR STRUKDAT DATA!!
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
